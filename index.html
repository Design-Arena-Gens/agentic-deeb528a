<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS WebOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Menu Bar -->
    <div id="menu-bar">
        <div class="menu-bar-left">
            <div class="menu-item apple-menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71,19.5C17.88,20.74 17,21.95 15.66,21.97C14.32,22 13.89,21.18 12.37,21.18C10.84,21.18 10.37,21.95 9.1,22C7.79,22.05 6.8,20.68 5.96,19.47C4.25,17 2.94,12.45 4.7,9.39C5.57,7.87 7.13,6.91 8.82,6.88C10.1,6.86 11.32,7.75 12.11,7.75C12.89,7.75 14.37,6.68 15.92,6.84C16.57,6.87 18.39,7.1 19.56,8.82C19.47,8.88 17.39,10.1 17.41,12.63C17.44,15.65 20.06,16.66 20.09,16.67C20.06,16.74 19.67,18.11 18.71,19.5M13,3.5C13.73,2.67 14.94,2.04 15.94,2C16.07,3.17 15.6,4.35 14.9,5.19C14.21,6.04 13.07,6.7 11.95,6.61C11.8,5.46 12.36,4.26 13,3.5Z"/>
                </svg>
            </div>
            <div class="menu-item menu-title">WebOS</div>
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Window</div>
            <div class="menu-item">Help</div>
        </div>
        <div class="menu-bar-right">
            <div class="menu-item" id="clock">12:00 PM</div>
            <div class="menu-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <!-- Desktop Icons -->
        <div class="desktop-icon" data-app="finder">
            <div class="icon-image">
                <svg width="64" height="64" viewBox="0 0 64 64">
                    <rect x="8" y="8" width="48" height="48" rx="8" fill="#4A90E2"/>
                    <path d="M32 20 L20 36 L32 36 L28 44 L44 28 L32 28 L36 20 Z" fill="white"/>
                </svg>
            </div>
            <div class="icon-label">Finder</div>
        </div>

        <div class="desktop-icon" data-app="calculator">
            <div class="icon-image">
                <svg width="64" height="64" viewBox="0 0 64 64">
                    <rect x="8" y="8" width="48" height="48" rx="8" fill="#FF9500"/>
                    <rect x="14" y="14" width="36" height="12" rx="2" fill="white" opacity="0.3"/>
                    <circle cx="20" cy="36" r="4" fill="white"/>
                    <circle cx="32" cy="36" r="4" fill="white"/>
                    <circle cx="44" cy="36" r="4" fill="white"/>
                    <circle cx="20" cy="48" r="4" fill="white"/>
                    <circle cx="32" cy="48" r="4" fill="white"/>
                    <circle cx="44" cy="48" r="4" fill="white"/>
                </svg>
            </div>
            <div class="icon-label">Calculator</div>
        </div>

        <div class="desktop-icon" data-app="notepad">
            <div class="icon-image">
                <svg width="64" height="64" viewBox="0 0 64 64">
                    <rect x="12" y="8" width="40" height="48" rx="4" fill="#FFD60A"/>
                    <line x1="18" y1="20" x2="46" y2="20" stroke="#333" stroke-width="2"/>
                    <line x1="18" y1="28" x2="46" y2="28" stroke="#333" stroke-width="2"/>
                    <line x1="18" y1="36" x2="40" y2="36" stroke="#333" stroke-width="2"/>
                </svg>
            </div>
            <div class="icon-label">Notepad</div>
        </div>

        <div class="desktop-icon" data-app="terminal">
            <div class="icon-image">
                <svg width="64" height="64" viewBox="0 0 64 64">
                    <rect x="8" y="8" width="48" height="48" rx="8" fill="#2C2C2C"/>
                    <path d="M18 24 L28 32 L18 40" stroke="#00FF00" stroke-width="2" fill="none"/>
                    <line x1="30" y1="38" x2="46" y2="38" stroke="#00FF00" stroke-width="2"/>
                </svg>
            </div>
            <div class="icon-label">Terminal</div>
        </div>

        <div class="desktop-icon" data-app="settings">
            <div class="icon-image">
                <svg width="64" height="64" viewBox="0 0 64 64">
                    <rect x="8" y="8" width="48" height="48" rx="8" fill="#8E8E93"/>
                    <circle cx="32" cy="32" r="12" fill="white"/>
                    <circle cx="32" cy="32" r="8" fill="#8E8E93"/>
                    <circle cx="32" cy="18" r="3" fill="white"/>
                    <circle cx="32" cy="46" r="3" fill="white"/>
                    <circle cx="18" cy="32" r="3" fill="white"/>
                    <circle cx="46" cy="32" r="3" fill="white"/>
                </svg>
            </div>
            <div class="icon-label">Settings</div>
        </div>
    </div>

    <!-- Dock -->
    <div id="dock">
        <div class="dock-container">
            <div class="dock-icon" data-app="finder" title="Finder">
                <svg width="56" height="56" viewBox="0 0 64 64">
                    <rect x="8" y="8" width="48" height="48" rx="8" fill="#4A90E2"/>
                    <path d="M32 20 L20 36 L32 36 L28 44 L44 28 L32 28 L36 20 Z" fill="white"/>
                </svg>
            </div>
            <div class="dock-icon" data-app="calculator" title="Calculator">
                <svg width="56" height="56" viewBox="0 0 64 64">
                    <rect x="8" y="8" width="48" height="48" rx="8" fill="#FF9500"/>
                    <rect x="14" y="14" width="36" height="12" rx="2" fill="white" opacity="0.3"/>
                    <circle cx="20" cy="36" r="4" fill="white"/>
                    <circle cx="32" cy="36" r="4" fill="white"/>
                    <circle cx="44" cy="36" r="4" fill="white"/>
                    <circle cx="20" cy="48" r="4" fill="white"/>
                    <circle cx="32" cy="48" r="4" fill="white"/>
                    <circle cx="44" cy="48" r="4" fill="white"/>
                </svg>
            </div>
            <div class="dock-icon" data-app="notepad" title="Notepad">
                <svg width="56" height="56" viewBox="0 0 64 64">
                    <rect x="12" y="8" width="40" height="48" rx="4" fill="#FFD60A"/>
                    <line x1="18" y1="20" x2="46" y2="20" stroke="#333" stroke-width="2"/>
                    <line x1="18" y1="28" x2="46" y2="28" stroke="#333" stroke-width="2"/>
                    <line x1="18" y1="36" x2="40" y2="36" stroke="#333" stroke-width="2"/>
                </svg>
            </div>
            <div class="dock-icon" data-app="terminal" title="Terminal">
                <svg width="56" height="56" viewBox="0 0 64 64">
                    <rect x="8" y="8" width="48" height="48" rx="8" fill="#2C2C2C"/>
                    <path d="M18 24 L28 32 L18 40" stroke="#00FF00" stroke-width="2" fill="none"/>
                    <line x1="30" y1="38" x2="46" y2="38" stroke="#00FF00" stroke-width="2"/>
                </svg>
            </div>
            <div class="dock-separator"></div>
            <div class="dock-icon" data-app="settings" title="Settings">
                <svg width="56" height="56" viewBox="0 0 64 64">
                    <rect x="8" y="8" width="48" height="48" rx="8" fill="#8E8E93"/>
                    <circle cx="32" cy="32" r="12" fill="white"/>
                    <circle cx="32" cy="32" r="8" fill="#8E8E93"/>
                    <circle cx="32" cy="18" r="3" fill="white"/>
                    <circle cx="32" cy="46" r="3" fill="white"/>
                    <circle cx="18" cy="32" r="3" fill="white"/>
                    <circle cx="46" cy="32" r="3" fill="white"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- Windows Container -->
    <div id="windows-container"></div>

    <script src="system.js"></script>
    <script src="apps.js"></script>
</body>
</html>
